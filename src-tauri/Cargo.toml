[package]
name = "couple-desktop-pet"
version = "0.1.0"
description = "A local-first cross-platform desktop pet."
authors = ["情侣桌宠 contributors"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
