name: macOS Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  developer-id-release:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      RELEASE_EVIDENCE_DIR: .superpowers/sdd/2026-08-07-macos-cross-platform/build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Preflight Apple Developer ID secrets
        run: |
          set -o pipefail
          missing=0
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD KEYCHAIN_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required Apple signing secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Formal regression
        run: |
          set -o pipefail
          mkdir -p "$RELEASE_EVIDENCE_DIR"
          pnpm test 2>&1 | tee "$RELEASE_EVIDENCE_DIR/pnpm-test.log"
          pnpm typecheck 2>&1 | tee "$RELEASE_EVIDENCE_DIR/pnpm-typecheck.log"
          pnpm build 2>&1 | tee "$RELEASE_EVIDENCE_DIR/pnpm-build.log"
          cargo test --manifest-path src-tauri/Cargo.toml 2>&1 | tee "$RELEASE_EVIDENCE_DIR/cargo-test.log"
          cargo check --manifest-path src-tauri/Cargo.toml 2>&1 | tee "$RELEASE_EVIDENCE_DIR/cargo-check.log"
          cargo fmt --check --manifest-path src-tauri/Cargo.toml 2>&1 | tee "$RELEASE_EVIDENCE_DIR/cargo-fmt-check.log"

      - name: Build Developer ID Universal DMG
        run: pnpm macos:formal-build

      - name: Post-build signing notarization and Gatekeeper evidence
        run: |
          set -o pipefail
          mkdir -p "$RELEASE_EVIDENCE_DIR"
          APP_PATH="$(find "$PWD/src-tauri/target/universal-apple-darwin/release/bundle/macos" -maxdepth 1 -name '*.app' -print -quit)"
          DMG_PATH="$(find "$PWD/src-tauri/target/universal-apple-darwin/release/bundle/dmg" -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$APP_PATH"
          test -n "$DMG_PATH"
          APP_BINARY="$APP_PATH/Contents/MacOS/couple-desktop-pet"
          codesign --verify --deep --strict --verbose=4 "$APP_PATH" 2>&1 | tee "$RELEASE_EVIDENCE_DIR/codesign-verify-app-final.log"
          codesign -dv --verbose=4 "$APP_PATH" 2>&1 | tee "$RELEASE_EVIDENCE_DIR/codesign-describe-app-final.log"
          xcrun notarytool history --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" 2>&1 | tee "$RELEASE_EVIDENCE_DIR/notarytool-history.log"
          xcrun stapler validate "$APP_PATH" 2>&1 | tee "$RELEASE_EVIDENCE_DIR/stapler-validate-app.log"
          xcrun stapler validate "$DMG_PATH" 2>&1 | tee "$RELEASE_EVIDENCE_DIR/stapler-validate-dmg.log"
          spctl --assess --type execute --verbose=4 "$APP_PATH" 2>&1 | tee "$RELEASE_EVIDENCE_DIR/spctl-assess-app.log"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$DMG_PATH" 2>&1 | tee "$RELEASE_EVIDENCE_DIR/spctl-assess-dmg.log"
          hdiutil verify "$DMG_PATH" 2>&1 | tee "$RELEASE_EVIDENCE_DIR/hdiutil-verify-formal-dmg.log"
          shasum -a 256 "$DMG_PATH" 2>&1 | tee "$RELEASE_EVIDENCE_DIR/sha256-dmg-final.log"
          shasum -a 256 "$APP_BINARY" 2>&1 | tee "$RELEASE_EVIDENCE_DIR/sha256-app-binary-final.log"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: macos-release-evidence
          if-no-files-found: warn
          path: .superpowers/sdd/2026-08-07-macos-cross-platform/build/**

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: success()
        with:
          name: couple-pet-macos-notarized-dmg
          if-no-files-found: warn
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
