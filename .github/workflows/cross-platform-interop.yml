name: Windows macOS Interop

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  coordinator:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      issue_number: ${{ steps.create.outputs.issue_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create encrypted rendezvous issue
        id: create
        env:
          INTEROP_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          ISSUE_NUMBER="$(pnpm interop:rendezvous:create -- --repo "${{ github.repository }}" --title "couple-pet interop ${{ github.run_id }}-${{ github.run_attempt }}" | tail -n 1)"
          test -n "$ISSUE_NUMBER"
          echo "issue_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"

  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    needs: coordinator
    env:
      WINDOWS_EVIDENCE_DIR: .superpowers/sdd/2026-08-07-macos-cross-platform/interop/windows
      WINDOWS_SCREENSHOT_DIR: .superpowers/sdd/2026-08-07-macos-cross-platform/interop/windows/screenshots
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows E2E app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:WINDOWS_EVIDENCE_DIR | Out-Null
          pnpm e2e:windows:build

      - name: Run Windows main interop suite
        shell: pwsh
        env:
          INTEROP_GITHUB_TOKEN: ${{ github.token }}
          INTEROP_GITHUB_REPOSITORY: ${{ github.repository }}
          INTEROP_ISSUE_NUMBER: ${{ needs.coordinator.outputs.issue_number }}
          INTEROP_ROLE: windows
          INTEROP_SESSION_ID: main
          INTEROP_APP_BINARY: ${{ github.workspace }}/src-tauri/target/release/couple-desktop-pet.exe
          INTEROP_APP_DATA_ROOT: ${{ runner.temp }}/couple-pet-interop-windows
          INTEROP_EVENT_LOG: .superpowers/sdd/2026-08-07-macos-cross-platform/interop/windows/events.jsonl
          INTEROP_SCREENSHOT_DIR: .superpowers/sdd/2026-08-07-macos-cross-platform/interop/windows/screenshots
        run: pnpm e2e:interop:windows

      - name: Run Windows restart interop suite
        shell: pwsh
        env:
          INTEROP_GITHUB_TOKEN: ${{ github.token }}
          INTEROP_GITHUB_REPOSITORY: ${{ github.repository }}
          INTEROP_ISSUE_NUMBER: ${{ needs.coordinator.outputs.issue_number }}
          INTEROP_ROLE: windows
          INTEROP_SESSION_ID: restart
          INTEROP_APP_BINARY: ${{ github.workspace }}/src-tauri/target/release/couple-desktop-pet.exe
          INTEROP_APP_DATA_ROOT: ${{ runner.temp }}/couple-pet-interop-windows
          INTEROP_EVENT_LOG: .superpowers/sdd/2026-08-07-macos-cross-platform/interop/windows/events.jsonl
          INTEROP_SCREENSHOT_DIR: .superpowers/sdd/2026-08-07-macos-cross-platform/interop/windows/screenshots
        run: pnpm e2e:interop:windows:restart

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: interop-windows-evidence
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            .superpowers/sdd/2026-08-07-macos-cross-platform/interop/windows/events.jsonl
            .superpowers/sdd/2026-08-07-macos-cross-platform/interop/windows/screenshots/**

  macos:
    runs-on: macos-15
    timeout-minutes: 60
    needs: coordinator
    env:
      MACOS_EVIDENCE_DIR: .superpowers/sdd/2026-08-07-macos-cross-platform/interop/macos
      MACOS_SCREENSHOT_DIR: .superpowers/sdd/2026-08-07-macos-cross-platform/interop/macos/screenshots
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build macOS E2E app
        run: |
          set -o pipefail
          mkdir -p "$MACOS_EVIDENCE_DIR"
          CARGO_TARGET_DIR="${{ runner.temp }}/interop-macos-target" pnpm e2e:macos:build
          E2E_BUNDLE_ROOT="${{ runner.temp }}/interop-macos-target/universal-apple-darwin/release/bundle/macos"
          E2E_APP_BINARY=""
          for candidate in "$E2E_BUNDLE_ROOT"/*.app/Contents/MacOS/couple-desktop-pet; do
            [ -f "$candidate" ] || continue
            E2E_APP_BINARY="$candidate"
            break
          done
          test -n "$E2E_APP_BINARY"
          echo "MACOS_INTEROP_APP_BINARY=$E2E_APP_BINARY" >> "$GITHUB_ENV"

      - name: Run macOS main interop suite
        env:
          INTEROP_GITHUB_TOKEN: ${{ github.token }}
          INTEROP_GITHUB_REPOSITORY: ${{ github.repository }}
          INTEROP_ISSUE_NUMBER: ${{ needs.coordinator.outputs.issue_number }}
          INTEROP_ROLE: macos
          INTEROP_SESSION_ID: main
          INTEROP_APP_BINARY: ${{ env.MACOS_INTEROP_APP_BINARY }}
          INTEROP_APP_DATA_ROOT: ${{ runner.temp }}/couple-pet-interop-macos
          INTEROP_EVENT_LOG: .superpowers/sdd/2026-08-07-macos-cross-platform/interop/macos/events.jsonl
          INTEROP_SCREENSHOT_DIR: .superpowers/sdd/2026-08-07-macos-cross-platform/interop/macos/screenshots
        run: pnpm e2e:interop:macos

      - name: Run macOS restart interop suite
        env:
          INTEROP_GITHUB_TOKEN: ${{ github.token }}
          INTEROP_GITHUB_REPOSITORY: ${{ github.repository }}
          INTEROP_ISSUE_NUMBER: ${{ needs.coordinator.outputs.issue_number }}
          INTEROP_ROLE: macos
          INTEROP_SESSION_ID: restart
          INTEROP_APP_BINARY: ${{ env.MACOS_INTEROP_APP_BINARY }}
          INTEROP_APP_DATA_ROOT: ${{ runner.temp }}/couple-pet-interop-macos
          INTEROP_EVENT_LOG: .superpowers/sdd/2026-08-07-macos-cross-platform/interop/macos/events.jsonl
          INTEROP_SCREENSHOT_DIR: .superpowers/sdd/2026-08-07-macos-cross-platform/interop/macos/screenshots
        run: pnpm e2e:interop:macos:restart

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: interop-macos-evidence
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            .superpowers/sdd/2026-08-07-macos-cross-platform/interop/macos/events.jsonl
            .superpowers/sdd/2026-08-07-macos-cross-platform/interop/macos/screenshots/**

  validator:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: always()
    needs:
      - windows
      - macos
    env:
      VALIDATOR_DIR: .superpowers/sdd/2026-08-07-macos-cross-platform/interop/validator
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download Windows interop evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: interop-windows-evidence
          path: .superpowers/sdd/2026-08-07-macos-cross-platform/interop/validator/artifacts/windows

      - name: Download macOS interop evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: interop-macos-evidence
          path: .superpowers/sdd/2026-08-07-macos-cross-platform/interop/validator/artifacts/macos

      - name: Validate interop evidence matrix
        run: |
          set -o pipefail
          mkdir -p "$VALIDATOR_DIR"
          WINDOWS_LOG="$VALIDATOR_DIR/artifacts/windows/events.jsonl"
          MACOS_LOG="$VALIDATOR_DIR/artifacts/macos/events.jsonl"
          if [ ! -f "$WINDOWS_LOG" ] || [ ! -f "$MACOS_LOG" ]; then
            echo "missing windows or macos interop JSONL log" | tee "$VALIDATOR_DIR/validator.log"
            exit 1
          fi
          pnpm interop:validate -- --log "$WINDOWS_LOG" --log "$MACOS_LOG" 2>&1 | tee "$VALIDATOR_DIR/validator.log"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: interop-validator-evidence
          if-no-files-found: warn
          include-hidden-files: true
          path: .superpowers/sdd/2026-08-07-macos-cross-platform/interop/validator/**

  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: always()
    needs:
      - coordinator
      - windows
      - macos
      - validator
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cleanup encrypted rendezvous issue
        env:
          INTEROP_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          ISSUE_NUMBER="${{ needs.coordinator.outputs.issue_number }}"
          if [ -z "$ISSUE_NUMBER" ]; then
            echo "no rendezvous issue was created"
            exit 0
          fi
          pnpm interop:rendezvous:cleanup -- --repo "${{ github.repository }}" --issue "$ISSUE_NUMBER"
